<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Clon de ChatGPT Real</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #343541; color: white; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 12px; border-radius: 8px; max-width: 80%; line-height: 1.4; }
        .user { background-color: #444654; align-self: flex-end; }
        .bot { background-color: #10a37f; align-self: flex-start; }
        #input-container { padding: 20px; background-color: #40414f; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: none; border-radius: 6px; background-color: #40414f; color: white; border: 1px solid #565869; }
        button { background-color: #10a37f; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; }
        button:disabled { background-color: #565869; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="chat-container">
        <div class="message bot">¡Conexión abierta establecida con éxito! No necesitas contraseñas. Pregúntame lo que quieras.</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Escribe tu mensaje aquí...">
        <button id="send-btn" onclick="enviarMensaje()">Enviar</button>
    </div>

    <script>
        async function enviarMensaje() {
            const input = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');
            const mensajeTexto = input.value.trim();
            if (mensajeTexto === "") return;

            const chatContainer = document.getElementById('chat-container');

            // 1. Mostrar tu mensaje en pantalla
            const userDiv = document.createElement('div');
            userDiv.className = 'message user';
            userDiv.innerText = mensajeTexto;
            chatContainer.appendChild(userDiv);
            input.value = "";
            
            sendBtn.disabled = true;

            // 2. Mostrar indicador de "Pensando..."
            const botDiv = document.createElement('div');
            botDiv.className = 'message bot';
            botDiv.innerText = "Pensando...";
            chatContainer.appendChild(botDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                // Usamos un servidor de IA libre de uso público para tus pruebas
                const response = await fetch("https://huggingface.co", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        inputs: `<|system|>\nEres un asistente en español amigable. Concreta tus respuestas en español.</s>\n<|user|>\n${mensajeTexto}</s>\n<|assistant|>\n`
                    })
                });

                const data = await response.json();
                
                if (data && data[0] && data[0].generated_text) {
                    // Limpiamos el texto para mostrar solo la respuesta de la IA
                    const textoCompleto = data[0].generated_text;
                    const partes = textoCompleto.split("<|assistant|>\n");
                    botDiv.innerText = partes[partes.length - 1].trim();
                } else {
                    botDiv.innerText = "La IA está ocupada procesando otras solicitudes, intenta enviar de nuevo.";
                }
            } catch (error) {
                botDiv.innerText = "Hubo un problema temporal con el servidor libre de IA.";
                console.error(error);
            }

            sendBtn.disabled = false;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
